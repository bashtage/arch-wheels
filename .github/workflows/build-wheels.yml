name: Build wheels

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_wheels:
    # Each job builds, repairs and tests exactly one wheel
    name: ${{ matrix.python }}-${{ matrix.wheel }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314, cp315]
        # The platform tag of the wheel, as in cibuildwheel's build identifiers
        wheel:
          - manylinux_x86_64
          - musllinux_x86_64
          - manylinux_aarch64
          - win_amd64
          - win_arm64
          - macosx_arm64
          - macosx_x86_64
        exclude:
          # statsmodels has win_arm64 wheels from Python 3.13, so the wheels for older
          # Pythons could not be tested
          - wheel: win_arm64
            python: cp310
          - wheel: win_arm64
            python: cp311
          - wheel: win_arm64
            python: cp312
        # The runner of each wheel. Every wheel is built on a runner of its own
        # architecture, so none is emulated and every wheel is tested.
        include:
          - wheel: manylinux_x86_64
            os: ubuntu-latest
          - wheel: musllinux_x86_64
            os: ubuntu-latest
          - wheel: manylinux_aarch64
            os: ubuntu-24.04-arm
          - wheel: win_amd64
            os: windows-latest
          - wheel: win_arm64
            os: windows-11-arm
          - wheel: macosx_arm64
            os: macos-latest
          - wheel: macosx_x86_64
            os: macos-15-intel
    env:
      BUILD_COMMIT: "main" # # main or a specific version, e.g., "v7.2.0"
      PYPI_UPLOAD: false  # true or false
      TESTPYPI_UPLOAD: false
      # A single build identifier, such as cp313-manylinux_x86_64, so that the job
      # builds one wheel
      CIBW_BUILD: ${{ matrix.python }}-${{ matrix.wheel }}
      CIBW_ARCHS: native
      CIBW_TEST_REQUIRES: "pytest>=9,<10 pytest-xdist"
      CIBW_TEST_COMMAND: python -c "import arch; arch.test(['-n','auto','--skip-slow'])"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: 'auditwheel repair --strip -w {dest_dir} {wheel}'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # One BLAS thread in the tests, except on Windows on ARM. There, numpy's OpenBLAS
      # crashes in numpy.linalg.inv and solve of 23x23 to 31x31 matrices when it starts
      # with one thread (numpy/numpy#29442; see bashtage/arch#1003). OpenBLAS also reads
      # OMP_NUM_THREADS, so none of these can be set there.
      - name: Limit the BLAS threads
        if: matrix.os != 'windows-11-arm'
        run: |
          {
            echo "MKL_NUM_THREADS=1"
            echo "OMP_NUM_THREADS=1"
            echo "OPENBLAS_NUM_THREADS=1"
          } >> "${GITHUB_ENV}"

      - name: Check that the BLAS threads are not limited
        if: matrix.os == 'windows-11-arm'
        run: |
          for var in OPENBLAS_NUM_THREADS GOTO_NUM_THREADS OMP_NUM_THREADS MKL_NUM_THREADS; do
            if [[ -n "${!var:-}" ]]; then
              echo "${var} is set to ${!var}"
              exit 1
            fi
          done

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        with:
          output-dir: wheelhouse
          package-dir: arch
        env:
          CIBW_BEFORE_BUILD: 'git submodule foreach git checkout  ${{ env.BUILD_COMMIT }}'

      - name: Check that one wheel was built
        run: |
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected 1 wheel for ${CIBW_BUILD}, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          echo "Built ${wheels[0]}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Only after the wheel was built, tested and checked
      - name: Upload wheels
        run: source twine-upload.sh
        env:
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
